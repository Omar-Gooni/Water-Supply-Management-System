{% extends "layouts/base.html" %}

{% block title %}Counter Receipts{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Counter Receipts</h2>
</div>

<div class="card p-4">
  <p>Welcome, {{ session.get('username') }}. You can review receipts here.</p>
  <a href="{{ url_for('receipt.list_receipts') }}" class="btn btn-primary mt-3" style="width: 200px;">
    <i class="fas fa-file-invoice-dollar"></i> View Receipts
  </a>
</div>
{% endblock %}
